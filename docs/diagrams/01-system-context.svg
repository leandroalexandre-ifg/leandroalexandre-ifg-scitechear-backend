<svg width="920" height="620" viewBox="0 0 920 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="920" height="620" fill="#FFFFFF"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#111827">SciTech Ear — Contexto Geral do Sistema</text>

<!-- CLIENTE -->
<rect x="30" y="60" width="860" height="170" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="50" y="86" font-size="15" font-weight="bold" fill="#04342C">Cliente móvel — Flutter (Android / iOS) — repositório scitechear</text>

<rect x="50" y="100" width="250" height="110" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="175" y="128" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#042C53">Cadastro &amp; amostra de voz</text>
<text x="175" y="150" font-size="11.5" text-anchor="middle" fill="#0C447C">participant_service.dart</text>
<text x="175" y="168" font-size="11.5" text-anchor="middle" fill="#0C447C">sincroniza 1x por participante</text>
<text x="175" y="186" font-size="11.5" text-anchor="middle" fill="#0C447C">(não a cada reunião)</text>

<rect x="335" y="100" width="250" height="110" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="460" y="128" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#042C53">Gravação &amp; upload</text>
<text x="460" y="150" font-size="11.5" text-anchor="middle" fill="#0C447C">audio_service · upload_service</text>
<text x="460" y="168" font-size="11.5" text-anchor="middle" fill="#0C447C">WAV 16kHz mono</text>
<text x="460" y="186" font-size="11.5" text-anchor="middle" fill="#0C447C">multipart: file + participants(JSON)</text>

<rect x="620" y="100" width="250" height="110" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="745" y="128" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#042C53">Acompanhamento &amp; resultado</text>
<text x="745" y="150" font-size="11.5" text-anchor="middle" fill="#0C447C">status_service (WS + polling)</text>
<text x="745" y="168" font-size="11.5" text-anchor="middle" fill="#0C447C">erro real nunca vira</text>
<text x="745" y="186" font-size="11.5" text-anchor="middle" fill="#0C447C">resultado fictício</text>

<!-- setas cliente -> backend -->
<text x="105" y="252" font-size="11" fill="#5B3FA8" text-anchor="middle">POST/GET/DELETE</text>
<text x="105" y="266" font-size="11" fill="#5B3FA8" text-anchor="middle">/participants/{id}/voice-*</text>
<line x1="105" y1="230" x2="105" y2="284" stroke="#5B3FA8" stroke-width="1.6" marker-end="url(#arrow)"/>

<text x="330" y="259" font-size="12" fill="#0F6E56" text-anchor="middle">POST /upload (multipart)</text>
<line x1="330" y1="230" x2="330" y2="284" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#arrow)"/>

<text x="620" y="259" font-size="12" fill="#185FA5" text-anchor="middle">GET /status · WS /ws · GET /resultado</text>
<line x1="620" y1="284" x2="620" y2="230" stroke="#185FA5" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- BACKEND -->
<rect x="30" y="288" width="860" height="300" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="50" y="314" font-size="15" font-weight="bold" fill="#26215C">Backend de IA — Python / FastAPI — repositório scitechear-backend (servidor com GPU)</text>

<rect x="50" y="330" width="250" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="175" y="356" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#4A1B0C">API — FastAPI</text>
<text x="175" y="376" font-size="11.5" text-anchor="middle" fill="#993C1D">app/api — upload · status · resultado · voz</text>

<rect x="335" y="330" width="250" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="460" y="356" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#412402">Job Executor</text>
<text x="460" y="376" font-size="11.5" text-anchor="middle" fill="#854F0B">execução em background thread</text>

<rect x="620" y="330" width="250" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="745" y="356" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2C2C2A">Repositories</text>
<text x="745" y="376" font-size="11.5" text-anchor="middle" fill="#444441">job · result · storage · voice</text>

<line x1="300" y1="360" x2="333" y2="360" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="585" y1="360" x2="618" y2="360" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>

<!-- Pipeline -->
<rect x="50" y="410" width="820" height="150" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="66" y="432" font-size="13.5" font-weight="bold" fill="#04342C">Pipeline (MeetingPipelineFacade) — 7 estágios, orquestrados em ordem</text>

<g font-size="11.3" text-anchor="middle">
<rect x="66" y="446" width="108" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="120" y="468" font-weight="bold" fill="#173404">WhisperX</text>
<text x="120" y="486" fill="#3B6D11">transcrição</text>

<rect x="188" y="446" width="108" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="242" y="468" font-weight="bold" fill="#173404">pyannote</text>
<text x="242" y="486" fill="#3B6D11">diarização</text>

<rect x="310" y="446" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="370" y="468" font-weight="bold" fill="#042C53">SpeechBrain</text>
<text x="370" y="486" fill="#0C447C">identificação (ECAPA)</text>

<rect x="444" y="446" width="108" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="498" y="468" font-weight="bold" fill="#2C2C2A">Formatter</text>
<text x="498" y="486" fill="#444441">linha→segmento</text>

<rect x="566" y="446" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="626" y="468" font-weight="bold" fill="#4A1B0C">Ollama</text>
<text x="626" y="486" fill="#993C1D">sumário + perguntas</text>

<rect x="700" y="446" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="775" y="468" font-weight="bold" fill="#4A1B0C">Resultado canônico</text>
<text x="775" y="486" fill="#993C1D">segments[] + questions[]</text>
</g>

<line x1="174" y1="474" x2="186" y2="474" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="296" y1="474" x2="308" y2="474" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="430" y1="474" x2="442" y2="474" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="552" y1="474" x2="564" y2="474" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="686" y1="474" x2="698" y2="474" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>

<line x1="370" y1="502" x2="370" y2="522" stroke="#3B6D11" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="230" y="522" width="280" height="26" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-dasharray="3,2"/>
<text x="370" y="539" font-size="11" text-anchor="middle" fill="#173404">VoiceRepository — embeddings por participant_id</text>
</svg>
