<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="920" height="786" fill="#FFFFFF"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#111827">Backend — Arquitetura em Camadas (scitechear-backend)</text>

<!-- API layer -->
<rect x="30" y="56" width="860" height="160" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="50" y="78" font-size="13.5" font-weight="bold" fill="#4A1B0C">app/api — camada HTTP (FastAPI routers)</text>
<g font-size="10.5" fill="#993C1D">
<rect x="50" y="90" width="266" height="56" rx="7" fill="#FFFFFF" stroke="#993C1D" stroke-opacity=".5"/>
<text x="183" y="108" text-anchor="middle" font-weight="bold" font-size="11" fill="#4A1B0C">jobs.py</text>
<text x="183" y="124" text-anchor="middle">/upload · /status · /resultado · /ws</text>
<text x="183" y="139" text-anchor="middle">/meetings — GET · PATCH · DELETE</text>

<rect x="327" y="90" width="266" height="56" rx="7" fill="#FFFFFF" stroke="#993C1D" stroke-opacity=".5"/>
<text x="460" y="108" text-anchor="middle" font-weight="bold" font-size="11" fill="#4A1B0C">participants.py</text>
<text x="460" y="124" text-anchor="middle">GET /participants (lista do usuário)</text>
<text x="460" y="139" text-anchor="middle">voice-samples · voice-profile</text>

<rect x="604" y="90" width="266" height="56" rx="7" fill="#FFFFFF" stroke="#993C1D" stroke-opacity=".5"/>
<text x="737" y="108" text-anchor="middle" font-weight="bold" font-size="11" fill="#4A1B0C">auth.py</text>
<text x="737" y="124" text-anchor="middle">register · login · refresh</text>
<text x="737" y="139" text-anchor="middle">logout · me</text>

<rect x="50" y="154" width="266" height="56" rx="7" fill="#FFFFFF" stroke="#993C1D" stroke-opacity=".5"/>
<text x="183" y="172" text-anchor="middle" font-weight="bold" font-size="11" fill="#4A1B0C">dependencies.py</text>
<text x="183" y="188" text-anchor="middle">get_current_user_id (Bearer)</text>
<text x="183" y="203" text-anchor="middle">user_id_from_ws_token (?token=)</text>

<rect x="327" y="154" width="266" height="56" rx="7" fill="#FFFFFF" stroke="#993C1D" stroke-opacity=".5"/>
<text x="460" y="172" text-anchor="middle" font-weight="bold" font-size="11" fill="#4A1B0C">health.py</text>
<text x="460" y="188" text-anchor="middle">/health · /ready</text>
<text x="460" y="203" text-anchor="middle">(checa Ollama e HF_TOKEN)</text>

<rect x="604" y="154" width="266" height="56" rx="7" fill="#FFFFFF" stroke="#993C1D" stroke-opacity=".5"/>
<text x="737" y="172" text-anchor="middle" font-weight="bold" font-size="11" fill="#4A1B0C">main.py</text>
<text x="737" y="188" text-anchor="middle">FastAPI app, CORS, routers</text>
<text x="737" y="203" text-anchor="middle">redige o token do log de acesso</text>
</g>

<line x1="450" y1="216" x2="450" y2="242" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow2)"/>

<!-- Services layer -->
<rect x="30" y="244" width="860" height="220" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="50" y="266" font-size="13.5" font-weight="bold" fill="#04342C">app/services — lógica de domínio e orquestração</text>

<g font-size="11">
<rect x="50" y="278" width="150" height="70" rx="7" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="125" y="298" text-anchor="middle" font-weight="bold" fill="#173404">transcription_</text>
<text x="125" y="312" text-anchor="middle" font-weight="bold" fill="#173404">service.py</text>
<text x="125" y="330" text-anchor="middle" fill="#3B6D11">WhisperX turbo/pt</text>
<text x="125" y="344" text-anchor="middle" fill="#3B6D11">sem Colab/Drive</text>

<rect x="212" y="278" width="150" height="70" rx="7" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="287" y="298" text-anchor="middle" font-weight="bold" fill="#173404">diarization_</text>
<text x="287" y="312" text-anchor="middle" font-weight="bold" fill="#173404">service.py</text>
<text x="287" y="330" text-anchor="middle" fill="#3B6D11">pyannote · waveform dict</text>
<text x="287" y="344" text-anchor="middle" fill="#3B6D11">(sem torchcodec)</text>

<rect x="374" y="278" width="150" height="70" rx="7" fill="#E6F1FB" stroke="#185FA5"/>
<text x="449" y="298" text-anchor="middle" font-weight="bold" fill="#042C53">voice_service.py</text>
<text x="449" y="316" text-anchor="middle" fill="#0C447C">ECAPA-TDNN</text>
<text x="449" y="330" text-anchor="middle" fill="#0C447C">extração + identificação</text>
<text x="449" y="344" text-anchor="middle" fill="#0C447C">threshold/margem/outlier</text>

<rect x="536" y="278" width="150" height="70" rx="7" fill="#E6F1FB" stroke="#185FA5"/>
<text x="611" y="298" text-anchor="middle" font-weight="bold" fill="#042C53">voice_enrollment_</text>
<text x="611" y="312" text-anchor="middle" font-weight="bold" fill="#042C53">service.py</text>
<text x="611" y="330" text-anchor="middle" fill="#0C447C">cadastro por</text>
<text x="611" y="344" text-anchor="middle" fill="#0C447C">participant_id</text>

<rect x="698" y="278" width="150" height="70" rx="7" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="773" y="298" text-anchor="middle" font-weight="bold" fill="#2C2C2A">voice_migration.py</text>
<text x="773" y="316" text-anchor="middle" fill="#444441">legado (por nome)</text>
<text x="773" y="330" text-anchor="middle" fill="#444441">→ participant_id</text>
<text x="773" y="344" text-anchor="middle" fill="#444441">não destrutivo</text>

<rect x="50" y="362" width="150" height="70" rx="7" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="125" y="382" text-anchor="middle" font-weight="bold" fill="#2C2C2A">transcript_</text>
<text x="125" y="396" text-anchor="middle" font-weight="bold" fill="#2C2C2A">formatter.py</text>
<text x="125" y="414" text-anchor="middle" fill="#444441">mapa linha→segmento</text>
<text x="125" y="428" text-anchor="middle" fill="#444441">(identidade nunca vem do LLM)</text>

<rect x="212" y="362" width="312" height="70" rx="7" fill="#FAECE7" stroke="#993C1D"/>
<text x="368" y="382" text-anchor="middle" font-weight="bold" fill="#4A1B0C">question_service.py</text>
<text x="368" y="400" text-anchor="middle" fill="#993C1D">Ollama: sumarização → explícitas → implícitas (JSON)</text>
<text x="368" y="416" text-anchor="middle" fill="#993C1D">refinamento opcional (ENABLE_IMPLICIT_REFINEMENT)</text>
<text x="368" y="430" text-anchor="middle" fill="#993C1D">prompts/ · sem RAG na V1</text>

<rect x="536" y="362" width="312" height="70" rx="7" fill="#FAEEDA" stroke="#854F0B"/>
<text x="692" y="382" text-anchor="middle" font-weight="bold" fill="#412402">pipeline_facade.py + worker.py</text>
<text x="692" y="400" text-anchor="middle" fill="#854F0B">MeetingPipelineFacade orquestra os 7 estágios;</text>
<text x="692" y="416" text-anchor="middle" fill="#854F0B">worker.py roda em processo separado, consome a fila</text>
<text x="692" y="430" text-anchor="middle" fill="#854F0B">(SQLite, sem Celery/Redis)</text>
</g>

<line x1="450" y1="464" x2="450" y2="490" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow2)"/>

<!-- Repositories layer -->
<rect x="30" y="492" width="860" height="94" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="50" y="514" font-size="13.5" font-weight="bold" fill="#2C2C2A">app/repositories — persistência (abstrai o filesystem)</text>
<g font-size="11" fill="#444441">
<rect x="50" y="526" width="195" height="48" rx="7" fill="#FFFFFF" stroke="#5F5E5A" stroke-opacity=".5"/>
<text x="147" y="548" text-anchor="middle" font-weight="bold" fill="#2C2C2A">job_repository.py</text>
<text x="147" y="564" text-anchor="middle">jobs + fila em SQLite (WAL)</text>

<rect x="255" y="526" width="195" height="48" rx="7" fill="#FFFFFF" stroke="#5F5E5A" stroke-opacity=".5"/>
<text x="352" y="548" text-anchor="middle" font-weight="bold" fill="#2C2C2A">result_repository.py</text>
<text x="352" y="564" text-anchor="middle">MeetingResult (JSON)</text>

<rect x="460" y="526" width="195" height="48" rx="7" fill="#FFFFFF" stroke="#5F5E5A" stroke-opacity=".5"/>
<text x="557" y="548" text-anchor="middle" font-weight="bold" fill="#2C2C2A">storage_repository.py</text>
<text x="557" y="564" text-anchor="middle">storage/jobs/&lt;id&gt;/</text>

<rect x="665" y="526" width="205" height="48" rx="7" fill="#FFFFFF" stroke="#5F5E5A" stroke-opacity=".5"/>
<text x="767" y="548" text-anchor="middle" font-weight="bold" fill="#2C2C2A">voice_repository.py</text>
<text x="767" y="564" text-anchor="middle">storage/voices/&lt;user&gt;/&lt;participant&gt;/</text>
</g>

<line x1="450" y1="586" x2="450" y2="612" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow2)"/>

<!-- Models -->
<rect x="30" y="614" width="860" height="60" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="50" y="636" font-size="13.5" font-weight="bold" fill="#26215C">app/models — schemas Pydantic (contrato canônico)</text>
<text x="50" y="656" font-size="11" fill="#3B2E82">user.py · participant.py · job.py (8 estados) · result.py (Segment, Question, MeetingResult, ResultMetadata)</text>

<!-- Legacy + prompts -->
<rect x="30" y="688" width="420" height="80" rx="12" fill="#FDF6EC" stroke="#B45309" stroke-width="1"/>
<text x="50" y="710" font-size="13" font-weight="bold" fill="#7A3A02">legacy/ — referência, nunca executado em produção</text>
<text x="50" y="729" font-size="11" fill="#7A3A02">notebooks/ (transcricao, diarizacao, llm — usam Colab/Drive)</text>
<text x="50" y="745" font-size="11" fill="#7A3A02">scripts/ (etapa2b, etapa3, cadastro_vozes, pipeline)</text>
<text x="50" y="761" font-size="11" fill="#7A3A02">banco_vozes/ — legado por nome (migrado, não versionado)</text>

<rect x="470" y="688" width="420" height="80" rx="12" fill="#FDF6EC" stroke="#B45309" stroke-width="1"/>
<text x="490" y="710" font-size="13" font-weight="bold" fill="#7A3A02">prompts/ — versionados, preservados semanticamente</text>
<text x="490" y="729" font-size="11" fill="#7A3A02">explicit_questions_v4.json · meeting_summary_v1.txt</text>
<text x="490" y="745" font-size="11" fill="#7A3A02">implicit_questions_v3.txt (JSON) · implicit_refiner_v1.txt</text>
<text x="490" y="761" font-size="11" fill="#7A3A02">(refinador desativado por default)</text>
