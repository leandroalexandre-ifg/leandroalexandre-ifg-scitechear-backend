<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="960" height="620" fill="#FFFFFF"/>
<text x="30" y="32" font-size="18" font-weight="bold" fill="#111827">Sequência Ponta a Ponta — da gravação ao resultado</text>

<!-- lifelines -->
<g font-size="12.5" font-weight="bold" text-anchor="middle">
<rect x="30" y="54" width="150" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="105" y="77" fill="#042C53">App Flutter</text>

<rect x="250" y="54" width="150" height="36" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="325" y="77" fill="#4A1B0C">API (FastAPI)</text>

<rect x="470" y="54" width="150" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="545" y="77" fill="#412402">Job Executor</text>

<rect x="690" y="54" width="150" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="765" y="77" fill="#04342C">Pipeline (7 estágios)</text>
</g>

<!-- lifelines vertical -->
<line x1="105" y1="90" x2="105" y2="590" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="325" y1="90" x2="325" y2="590" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="545" y1="90" x2="545" y2="590" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="765" y1="90" x2="765" y2="590" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3"/>

<g font-size="11.5" fill="#111827">
<!-- 1 -->
<line x1="105" y1="112" x2="323" y2="112" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow4)"/>
<text x="115" y="106">1. POST /upload (áudio WAV + participants JSON)</text>

<line x1="325" y1="136" x2="107" y2="136" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow4)"/>
<text x="115" y="130">2. 202 Accepted { job_id, status: "queued" }</text>

<line x1="325" y1="160" x2="543" y2="160" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow4)"/>
<text x="335" y="154">3. cria job, salva áudio, dispara execução</text>

<line x1="545" y1="184" x2="763" y2="184" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow4)"/>
<text x="555" y="178">4. executar(job_id) em background thread</text>

<!-- polling loop box -->
<rect x="95" y="204" width="750" height="238" rx="10" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,3"/>
<text x="105" y="222" font-style="italic" fill="#6B7280">loop — enquanto status ≠ done/error (WebSocket com fallback de polling a cada 3s)</text>

<text x="765" y="246" text-anchor="middle" font-weight="bold" fill="#04342C">transcribing</text>
<text x="765" y="264" text-anchor="middle" fill="#3B6D11" font-size="10.5">WhisperX gera segments</text>

<text x="765" y="290" text-anchor="middle" font-weight="bold" fill="#04342C">diarizing</text>
<text x="765" y="308" text-anchor="middle" fill="#3B6D11" font-size="10.5">pyannote agrupa clusters (SPEAKER_N)</text>

<text x="765" y="334" text-anchor="middle" font-weight="bold" fill="#04342C">identifying</text>
<text x="765" y="352" text-anchor="middle" fill="#0C447C" font-size="10.5">SpeechBrain compara com VoiceRepository</text>

<text x="765" y="378" text-anchor="middle" font-weight="bold" fill="#04342C">summarizing → extracting</text>
<text x="765" y="396" text-anchor="middle" fill="#993C1D" font-size="10.5">Ollama: sumário, perguntas explícitas + implícitas</text>

<line x1="325" y1="418" x2="107" y2="418" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow4)"/>
<text x="115" y="412">5. GET /status/{job_id} → status atual (repetido)</text>

<!-- end loop -->
<line x1="545" y1="452" x2="327" y2="452" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow4)"/>
<text x="335" y="446">6. status = "done" (resultado canônico persistido)</text>

<line x1="105" y1="480" x2="323" y2="480" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow4)"/>
<text x="115" y="474">7. GET /resultado/{job_id}</text>

<line x1="325" y1="504" x2="107" y2="504" stroke="#374151" stroke-width="1.4" marker-end="url(#arrow4)"/>
<text x="115" y="498">8. 200 { segments[], questions[], metadata } — dados reais, nunca fixture</text>

<text x="115" y="530" font-style="italic" fill="#B45309">Em qualquer falha: status = "error" { code, message } — app mostra erro real com retry, nunca inventa resultado.</text>
</g>
</svg>
