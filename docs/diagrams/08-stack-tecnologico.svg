<rect x="50" y="410" width="836" height="34" rx="7" fill="#EEEDFE" stroke="#5B3FA8" stroke-opacity=".6"/>
<text x="468" y="431" font-size="10.5" text-anchor="middle" fill="#26215C">Ollama 0.33.3 servindo qwen3:14b (14 GB de VRAM) em 127.0.0.1:11434 — unidade systemd separada, HTTP local, sem SDK</text>

<line x1="450" y1="456" x2="450" y2="480" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#s8)"/>

<!-- persistencia -->
<rect x="30" y="482" width="860" height="160" rx="12" fill="#FAEEDA" stroke="#B45309"/>
<text x="50" y="504" font-size="13" font-weight="bold" fill="#7A3A02">Persistência — sem servidor de banco, sem fila, sem cache</text>
<g font-size="10" fill="#854F0B">
<rect x="50" y="514" width="410" height="112" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-opacity=".6"/>
<text x="255" y="534" font-size="12" font-weight="bold" text-anchor="middle" fill="#7A3A02">SQLite 3.45.1 — arquivo único jobs.db</text>
<text x="66" y="552">SQLAlchemy 2.0.51 (ORM) · journal_mode=WAL · 64 KB hoje</text>
<text x="66" y="568">jobs · job_status_events · users · refresh_tokens</text>
<text x="66" y="584">auth_failed_attempts</text>
<text x="66" y="604" font-style="italic">schema por create_all(), sem migração: não há Alembic em uso</text>
<text x="66" y="618" font-style="italic">(o binário existe no venv, é dependência transitiva)</text>

<rect x="476" y="514" width="410" height="112" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-opacity=".6"/>
<text x="681" y="534" font-size="12" font-weight="bold" text-anchor="middle" fill="#7A3A02">Sistema de arquivos — o que não cabe em linha</text>
<text x="492" y="552">jobs/&lt;job_id&gt;/audio.wav — o WAV enviado</text>
<text x="492" y="568">jobs/&lt;job_id&gt;/result.json — resultado canônico</text>
<text x="492" y="584">voices/&lt;user_id&gt;/&lt;participant_id&gt;/embedding.pt</text>
<text x="492" y="604" font-style="italic">fora do checkout git: git clean nunca alcança dado de usuário</text>
<text x="492" y="618" font-style="italic">em /data/projects/leandro/scitechear/storage</text>
</g>

