<rect width="920" height="772" fill="#FFFFFF"/>
<text x="30" y="34" font-size="18" font-weight="bold" fill="#111827">Ferramental — versões em produção no NumbERS</text>
<text x="30" y="54" font-size="12" fill="#5F5E5A">Levantado do ambiente real em 07/09/2026, não do requirements.txt. Ubuntu 24.04 · Python 3.12.3 · nada em contêiner.</text>

<!-- cliente -->
<rect x="30" y="72" width="860" height="88" rx="12" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="50" y="94" font-size="13" font-weight="bold" fill="#2C2C2A">Cliente — repositório SciTech-frontend</text>
