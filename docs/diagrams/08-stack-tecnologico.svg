<rect x="50" y="104" width="200" height="44" rx="7" fill="#FFFFFF" stroke="#5F5E5A" stroke-opacity=".5"/>
<text x="150" y="122" font-size="11" font-weight="bold" fill="#2C2C2A">Flutter / Dart</text>
<text x="150" y="138">app Android (build de dev)</text>
<rect x="262" y="104" width="200" height="44" rx="7" fill="#FFFFFF" stroke="#5F5E5A" stroke-opacity=".5"/>
