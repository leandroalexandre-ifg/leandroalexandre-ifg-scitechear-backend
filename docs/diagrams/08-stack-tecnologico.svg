<text x="50" y="286" font-size="10" fill="#993C1D">python-multipart 0.0.20 recebe o WAV em pedaços · a API nunca carrega modelo de ML: só grava o job e lê o banco.</text>

<line x1="450" y1="298" x2="450" y2="322" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#s8)"/>

<!-- worker -->
